services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cpd_api
    restart: unless-stopped
    ports:
      - "3061:4000"
    env_file:
      - .env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/db:/app/packages/db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cpd_web
    restart: unless-stopped
    ports:
      - "3060:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3061
    depends_on:
      - api

