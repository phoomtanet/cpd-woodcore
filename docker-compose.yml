services:
  postgres:
    image: postgres:16-alpine
    container_name: cpd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cpd_woodcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cpd_woodcore']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cpd_api
    restart: unless-stopped
    ports:
      - '3061:4000'
    env_file:
      - .env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/db:/app/packages/db
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cpd_web
    restart: unless-stopped
    ports:
      - '3060:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3061/api
    depends_on:
      - api

volumes:
  postgres_data:
